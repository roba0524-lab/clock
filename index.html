<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
<title>Weather Clock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: rgb(51,123,204);
  --text: #ffffff;
  --wind-duration: 3s;
  --wind-count: 5;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  overflow-y: auto;
  overflow-x: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  touch-action: pan-y;
  min-width: 120px;
}

/* ===== 風エフェクト ===== */
.wind-lines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
  transition: opacity 0.3s;
}

.wind-line {
  position: absolute;
  width: 200vw;
  height: 100%;
  left: -100vw;
  background: transparent;
  opacity: 0;
}

.wind-line svg {
  width: 100%;
  height: 100%;
}

@keyframes windMove {
  0% { 
    transform: translateX(0) scaleX(2); 
    opacity: 0;
  }
  15% {
    transform: translateX(5vw) scaleX(7);
    opacity: 1;
  }
  30% {
    transform: translateX(15vw) scaleX(10);
  }
  50% {
    transform: translateX(40vw) scaleX(15);
  }
  70% {
    transform: translateX(65vw) scaleX(20);
  }
  85% {
    transform: translateX(85vw) scaleX(25);
    opacity: 1;
  }
  100% { 
    transform: translateX(100vw) scaleX(30); 
    opacity: 0;
  }
}

.container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: burnin 180s infinite alternate ease-in-out;
}

/* PC用レイアウト */
@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .container {
    gap: 8vh;
  }
}

/* 焼き付き防止 */
@keyframes burnin {
  from { transform: translate(0,0); }
  to   { transform: translate(8px,6px); }
}

/* ===== 時刻 ===== */
.time-wrapper {
  display: grid;
  grid-template-columns: repeat(2, 42vw);
  grid-template-rows: repeat(2, 42vw);
  gap: 3vw;
}

.time-box {
  display: contents;
}

/* スマホ用：各桁を固定幅ボックスに */
.digit {
  width: 42vw;
  height: 42vw;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: "Orbitron", sans-serif;
  font-weight: 900;
  font-size: 38vw;
  line-height: 1;
  background: rgba(255, 255, 255, 0.95);
  color: var(--bg);
  border-radius: 4vw;
  animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
}

/* 各桁を少しずつ遅延させる */
#hourTen { animation-delay: 0s; }
#hourOne { animation-delay: 0.1s; }
#minTen { animation-delay: 0.2s; }
#minOne { animation-delay: 0.3s; }

@keyframes bounceIn {
  0% {
    transform: scale(0);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.colon {
  display: none;
  opacity: 0;
}

/* PC用横組み */
@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .time-wrapper {
    display: flex;
    align-items: center;
    gap: 2vw;
  }

  .time-box {
    display: flex;
    gap: 1.5vw;
  }

  .digit {
    width: 20vw;
    height: 20vw;
    font-size: 18vw;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 2.5vw;
  }

  .colon {
    display: flex;
    flex-direction: column;
    gap: 2vw;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeInColon 0.5s 0.8s forwards, blinkColon 2s 1.3s infinite ease-in-out;
  }

  .colon::before,
  .colon::after {
    content: "";
    width: 3vw;
    height: 3vw;
    background: white;
    border-radius: 50%;
  }

  @keyframes fadeInColon {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes blinkColon {
    0%, 40% { opacity: 1; }
    50%, 90% { opacity: 0; }
    100% { opacity: 1; }
  }
}

/* 分切り替え */
.flip {
  animation: flip 0.35s ease;
}

@keyframes flip {
  0%   { transform: rotateX(0); }
  50%  { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}

/* ===== 日付・天気 ===== */
.date,
.weather {
  font-family: "Zen Kaku Gothic New", sans-serif;
}

.date {
  font-size: 6vw;
  font-weight: 600;
  margin: 3px 0;
  letter-spacing: -0.025em;
  animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  animation-delay: 0.4s;
}

.num-tight {
  letter-spacing: -0.2em;
}

@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .date {
    font-size: 3vw;
  }
}

.weather {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.weather-icon {
  animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  animation-delay: 0.5s;
}

.temp {
  animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  animation-delay: 0.6s;
}

.rain {
  animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  animation-delay: 0.7s;
  position: relative;
}

.rain .wind-display {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  opacity: 0;
  transition: opacity 0.5s;
}

.rain .wind-display.show {
  opacity: 1;
}

.rain .rain-display {
  transition: opacity 0.5s;
}

.rain .rain-display.hide {
  opacity: 0;
}

/* 天気情報スライドアニメーション */
.weather-slide {
  animation: slideWeather 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

@keyframes slideWeather {
  0% {
    transform: translateX(0);
    opacity: 1;
  }
  40% {
    transform: translateX(120vw);
    opacity: 0;
  }
  60% {
    transform: translateX(-120vw);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}

.weather-icon {
  font-size: 16vw;
}

@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .weather-icon {
    font-size: 8vw;
  }
}

.temp, .rain {
  font-size: 6.5vw;
  font-weight: 700;
  letter-spacing: -0.025em;
}

@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .temp, .rain {
    font-size: 3vw;
  }
}

/* ===== 外周ドット ===== */
.edge-dot {
  position: fixed;
  width: 10px;
  height: 10px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.edge-dot.active {
  animation: fade 1s infinite;
}

@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .edge-dot {
    display: none;
  }
}

@keyframes fade {
  0%   { opacity: 0; }
  30%  { opacity: 0.9; }
  60%  { opacity: 0.3; }
  100% { opacity: 0; }
}

/* ===== 週間予報 ===== */
.weekly-forecast {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5vh 5vw;
  gap: 2vh;
}

.forecast-item {
  font-family: "Zen Kaku Gothic New", sans-serif;
  font-size: 5vw;
  font-weight: 600;
  letter-spacing: -0.025em;
  display: flex;
  align-items: center;
  gap: 3vw;
  width: 90vw;
  max-width: 600px;
}

.forecast-date {
  width: 30vw;
  text-align: left;
  white-space: nowrap;
}

.forecast-icon {
  font-size: 8vw;
  width: 10vw;
  text-align: center;
}

.forecast-temp {
  width: 20vw;
  text-align: center;
}

.forecast-rain {
  display: flex;
  align-items: center;
  gap: 1vw;
  flex: 1;
}

@media (min-width: 768px), (orientation: landscape) and (max-width: 767px) {
  .weekly-forecast {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3vw;
  }
  
  .forecast-item {
    font-size: 2vw;
    flex-direction: column;
    width: auto;
    gap: 1vh;
    text-align: center;
  }
  
  .forecast-date {
    width: auto;
    font-size: 2.5vw;
    text-align: center;
  }
  
  .forecast-icon {
    font-size: 5vw;
    width: auto;
  }
  
  .forecast-temp {
    width: auto;
    font-size: 2vw;
  }
  
  .forecast-rain {
    justify-content: center;
    font-size: 2vw;
  }
}

/* ===== スクロールボタン ===== */
.scroll-button {
  position: fixed;
  bottom: 5vh;
  right: 5vw;
  font-size: 10vw;
  color: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  z-index: 9999;
  transition: color 0.3s;
  user-select: none;
  display: block;
  pointer-events: auto;
}

.scroll-button:hover {
  color: rgba(255, 255, 255, 0.7);
}

.scroll-button.hidden {
  display: none !important;
}


</style>
</head>

<body>

<div class="wind-lines">
  <div class="wind-line">
    <svg viewBox="0 0 200 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:white;stop-opacity:0" />
          <stop offset="15%" style="stop-color:white;stop-opacity:0.3" />
          <stop offset="25%" style="stop-color:white;stop-opacity:0.6" />
          <stop offset="35%" style="stop-color:white;stop-opacity:0.3" />
          <stop offset="50%" style="stop-color:white;stop-opacity:0" />
          <stop offset="65%" style="stop-color:white;stop-opacity:0.3" />
          <stop offset="75%" style="stop-color:white;stop-opacity:0.6" />
          <stop offset="85%" style="stop-color:white;stop-opacity:0.3" />
          <stop offset="100%" style="stop-color:white;stop-opacity:0" />
        </linearGradient>
      </defs>
      <path d="M0,50 Q25,10 50,50 T100,50 T150,50 T200,50" 
            fill="none" 
            stroke="url(#waveGrad)" 
            stroke-width="40" 
            stroke-linecap="round"/>
      <path d="M0,55 Q25,15 50,55 T100,55 T150,55 T200,55" 
            fill="none" 
            stroke="url(#waveGrad)" 
            stroke-width="20" 
            stroke-linecap="round"
            opacity="0.5"/>
    </svg>
  </div>
</div>

<div class="container">
  <div class="time-wrapper">
    <div class="time-box hour">
      <div class="digit" id="hourTen">-</div>
      <div class="digit" id="hourOne">-</div>
    </div>
    <div class="colon"></div>
    <div class="time-box minute">
      <div class="digit" id="minTen">-</div>
      <div class="digit" id="minOne">-</div>
    </div>
  </div>

  <div id="date" class="date">--</div>

  <div class="weather">
    <div id="weatherIcon" class="weather-icon">--</div>
    <div id="temp" class="temp">--℃ / --℃（--℃）</div>
    <div id="rain" class="rain">
      <div class="rain-display">☂️ --%</div>
      <div class="wind-display">🌬️ --m/s</div>
    </div>
  </div>
</div>

<div class="weekly-forecast" id="weeklyForecast"></div>

<div id="edgeDot" class="edge-dot"></div>

<div class="scroll-button" id="scrollDownBtn">▼</div>
<div class="scroll-button hidden" id="scrollUpBtn">▲</div>

<script>
/* ===== 時刻 ===== */
let lastMinute = null;
let lastSecond = null;
let isInitialLoad = true;

function toFullWidth(str) {
  return str.replace(/[0-9]/g, (s) => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
}

function wrapNumbers(str) {
  return str.replace(/[０-９]+/g, (match) => `<span class="num-tight">${match}</span>`);
}

function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = now.getSeconds();

  hourTen.textContent = h[0];
  hourOne.textContent = h[1];

  if (m !== lastMinute) {
    if (!isInitialLoad) {
      minTen.classList.remove("flip");
      minOne.classList.remove("flip");
      void minTen.offsetWidth;
      minTen.classList.add("flip");
      minOne.classList.add("flip");
    }
    minTen.textContent = m[0];
    minOne.textContent = m[1];
    lastMinute = m;
    isInitialLoad = false;
  }

  if (s === 0 && s !== lastSecond) {
    const weatherEl = document.querySelector(".weather");
    weatherEl.classList.remove("weather-slide");
    void weatherEl.offsetWidth;
    weatherEl.classList.add("weather-slide");
  }
  lastSecond = s;

  const w = ["日","月","火","水","木","金","土"];
  const month = toFullWidth(String(now.getMonth() + 1));
  const day = toFullWidth(String(now.getDate()));
  const dateStr = `${month}月${day}日（${w[now.getDay()]}）`;
  date.innerHTML = wrapNumbers(dateStr);
}

updateTime();
setInterval(updateTime, 1000);



const dot = document.getElementById("edgeDot");

setTimeout(() => {
  if (dot && dot.classList) {
    dot.classList.add('active');
  }
}, 800);

function updateEdgeDot() {
  const now = new Date();
  const sec = now.getSeconds() + now.getMilliseconds() / 1000;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const perimeter = 2 * (w + h);
  const offset = w / 2;
  let d = (sec / 60) * perimeter + offset;
  d %= perimeter;

  let x, y;
  if (d < w) {
    x = d;
    y = 0;
  } else if (d < w + h) {
    x = w;
    y = d - w;
  } else if (d < w + h + w) {
    x = w - (d - w - h);
    y = h;
  } else {
    x = 0;
    y = h - (d - w - h - w);
  }

  dot.style.left = `${x - 5}px`;
  dot.style.top  = `${y - 5}px`;
}

setInterval(updateEdgeDot, 16);

/* ===== 天気 ===== */
let currentWindSpeed = 0;

async function fetchWeather() {
  const url =
    "https://api.open-meteo.com/v1/forecast" +
    "?latitude=34.612&longitude=135.734" +
    "&current=temperature_2m,wind_speed_10m" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code" +
    "&timezone=Asia%2FTokyo" +
    "&forecast_days=8";

  const res = await fetch(url);
  const data = await res.json();

  const max = Math.round(data.daily.temperature_2m_max[0]);
  const min = Math.round(data.daily.temperature_2m_min[0]);
  const nowTemp = Math.round(data.current.temperature_2m);
  const rainVal = data.daily.precipitation_probability_max[0];
  const code = data.daily.weather_code[0];
  currentWindSpeed = data.current.wind_speed_10m / 3.6;

  let icon = "☀️";
  let bgColor = "rgb(255,140,60)";
  
  if (code >= 1 && code <= 3) {
    icon = "⛅";
    bgColor = "rgb(120,120,120)";
  } else if (code >= 45) {
    icon = "☁️";
    bgColor = "rgb(120,120,120)";
  }
  
  if (rainVal >= 35) {
    icon = "🌧️";
    bgColor = "rgb(51,123,204)";
  }

  weatherIcon.textContent = icon;
  
  const tempStr = `${toFullWidth(String(max))}℃ / ${toFullWidth(String(min))}℃（${toFullWidth(String(nowTemp))}℃）`;
  temp.innerHTML = wrapNumbers(tempStr);
  
  const rainStr = `☂️ ${toFullWidth(String(rainVal))}%`;
  document.querySelector('.rain-display').innerHTML = wrapNumbers(rainStr);
  
  const windStr = `🌬️ ${toFullWidth(String(Math.round(currentWindSpeed)))}m/s`;
  document.querySelector('.wind-display').innerHTML = `<span style="white-space: nowrap;">${wrapNumbers(windStr)}</span>`;
  
  const now = new Date();
  if (now.getHours() >= 18 || now.getHours() < 5) {
    document.documentElement.style.setProperty("--bg", "#0b1d3a");
  } else {
    document.documentElement.style.setProperty("--bg", bgColor);
  }
  
  updateWeeklyForecast(data);
  updateWindEffect();
}

function updateWeeklyForecast(data) {
  const weeklyContainer = document.getElementById('weeklyForecast');
  weeklyContainer.innerHTML = '';
  
  const dayNames = ["日","月","火","水","木","金","土"];
  
  for (let i = 1; i <= 7; i++) {
    const date = new Date(data.daily.time[i]);
    const month = toFullWidth(String(date.getMonth() + 1));
    const day = toFullWidth(String(date.getDate()));
    const dayOfWeek = dayNames[date.getDay()];
    
    const max = Math.round(data.daily.temperature_2m_max[i]);
    const min = Math.round(data.daily.temperature_2m_min[i]);
    const rainProb = data.daily.precipitation_probability_max[i];
    const code = data.daily.weather_code[i];
    
    let weatherIcon = "☀️";
    if (code >= 1 && code <= 3) weatherIcon = "⛅";
    else if (code >= 45) weatherIcon = "☁️";
    if (rainProb >= 50) weatherIcon = "🌧️";
    
    const item = document.createElement('div');
    item.className = 'forecast-item';
    item.innerHTML = `
      <div class="forecast-date">${wrapNumbers(`${month}/${day}（${dayOfWeek}）`)}</div>
      <div class="forecast-icon">${weatherIcon}</div>
      <div class="forecast-temp">${wrapNumbers(`${toFullWidth(String(max))}/${toFullWidth(String(min))}℃`)}</div>
      <div class="forecast-rain">☂️${wrapNumbers(`${toFullWidth(String(rainProb))}%`)}</div>
    `;
    
    weeklyContainer.appendChild(item);
  }
}

function updateWindEffect() {
  const windLine = document.querySelector('.wind-line');
  const root = document.documentElement;
  
  if (currentWindSpeed === 0) {
    windLine.style.display = 'none';
    return;
  }
  
  windLine.style.display = 'block';
  
  let duration, interval;
  
  if (currentWindSpeed <= 1.6) {
    duration = 8;
    interval = 15000;
  } else if (currentWindSpeed <= 3.4) {
    duration = 6;
    interval = 15000;
  } else if (currentWindSpeed <= 5.5) {
    duration = 4;
    interval = 7500;
  } else if (currentWindSpeed <= 8.0) {
    duration = 2;
    interval = 5000;
  } else if (currentWindSpeed <= 10.8) {
    duration = 1;
    interval = 3750;
  } else {
    duration = 0.8;
    interval = 3000;
  }
  
  root.style.setProperty('--wind-duration', `${duration}s`);
  
  if (window.windInterval) {
    clearInterval(window.windInterval);
  }
  
  function triggerWind() {
    windLine.style.animation = 'none';
    void windLine.offsetWidth;
    windLine.style.animation = `windMove ${duration}s linear`;
  }
  
  triggerWind();
  window.windInterval = setInterval(triggerWind, interval);
}

function toggleWindDisplay() {
  const rainDisplay = document.querySelector('.rain-display');
  const windDisplay = document.querySelector('.wind-display');
  
  rainDisplay.classList.add('hide');
  windDisplay.classList.add('show');
  
  setTimeout(() => {
    rainDisplay.classList.remove('hide');
    windDisplay.classList.remove('show');
  }, 5000);
}

fetchWeather();
setInterval(fetchWeather, 30 * 60 * 1000);
setInterval(toggleWindDisplay, 15000);

/* ===== スクロール制御 ===== */
const scrollDownBtn = document.getElementById('scrollDownBtn');
const scrollUpBtn = document.getElementById('scrollUpBtn');
const windLines = document.querySelector('.wind-lines');
const edgeDot = document.getElementById('edgeDot');

let isScrolling = false;
let currentScreen = 'top';

scrollDownBtn.addEventListener('click', () => {
  if (isScrolling || currentScreen === 'bottom') return;
  isScrolling = true;
  currentScreen = 'bottom';
  
  scrollDownBtn.classList.add('hidden');
  scrollUpBtn.classList.remove('hidden');
  
  const start = window.scrollY;
  const target = window.innerHeight;
  const distance = target - start;
  const duration = 800;
  let startTime = null;

  function animation(currentTime) {
    if (startTime === null) startTime = currentTime;
    const timeElapsed = currentTime - startTime;
    const progress = Math.min(timeElapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 4);
    window.scrollTo(0, start + distance * ease);
    
    if (progress < 1) {
      requestAnimationFrame(animation);
    } else {
      isScrolling = false;
      if (edgeDot) {
        edgeDot.style.opacity = '0';
        edgeDot.classList.remove('active');
      }
      if (windLines) {
        windLines.style.opacity = '0';
      }
    }
  }
  
  requestAnimationFrame(animation);
});

scrollUpBtn.addEventListener('click', () => {
  if (isScrolling || currentScreen === 'top') return;
  isScrolling = true;
  currentScreen = 'top';
  
  scrollDownBtn.classList.remove('hidden');
  scrollUpBtn.classList.add('hidden');
  
  const start = window.scrollY;
  const target = 0;
  const distance = target - start;
  const duration = 800;
  let startTime = null;

  function animation(currentTime) {
    if (startTime === null) startTime = currentTime;
    const timeElapsed = currentTime - startTime;
    const progress = Math.min(timeElapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 4);
    window.scrollTo(0, start + distance * ease);
    
    if (progress < 1) {
      requestAnimationFrame(animation);
    } else {
      isScrolling = false;
      if (edgeDot) {
        edgeDot.classList.add('active');
        edgeDot.style.opacity = '1';
      }
      if (windLines) {
        windLines.style.opacity = '1';
      }
    }
  }
  
  requestAnimationFrame(animation);
});

window.addEventListener('scroll', () => {
  if (isScrolling) return;
  
  const scrollPosition = window.scrollY;
  const viewportHeight = window.innerHeight;
  
  if (scrollPosition > viewportHeight / 2) {
    if (currentScreen !== 'bottom') {
      currentScreen = 'bottom';
      scrollDownBtn.classList.add('hidden');
      scrollUpBtn.classList.remove('hidden');
      
      if (edgeDot) {
        edgeDot.style.opacity = '0';
        edgeDot.classList.remove('active');
      }
      if (windLines) {
        windLines.style.opacity = '0';
      }
    }
  } else {
    if (currentScreen !== 'top') {
      currentScreen = 'top';
      scrollDownBtn.classList.remove('hidden');
      scrollUpBtn.classList.add('hidden');
      
      if (edgeDot) {
        edgeDot.classList.add('active');
        edgeDot.style.opacity = '1';
      }
      if (windLines) {
        windLines.style.opacity = '1';
      }
    }
  }
});

/* ===== タップアニメーション ===== */
let uiAnimating = false;

document.addEventListener('click', (e) => {
  if (e.target.closest('.scroll-button')) return;
  spawnBurst(e.clientX, e.clientY);
  triggerUIAnimation();
});

document.addEventListener('touchstart', (e) => {
  if (e.target.closest('.scroll-button')) return;
  const t = e.touches[0];
  spawnBurst(t.clientX, t.clientY);
  triggerUIAnimation();
}, { passive: true });

/* ===== UI要素ランダムアニメーション ===== */
const UI_ANIMS = [
  'scatter',    // バラバラに飛び散って戻る
  'spin',       // 各桁がバラバラに回転
  'rubber',     // ぐにゃぐにゃ伸縮
  'gravity',    // 下に落ちて跳ね返る
  'vortex',     // 渦を巻いて集まる
  'glitch',     // グリッチノイズ
  'flip3d',     // 3D回転して戻る
  'wave',       // 波のように順番にジャンプ
];

function triggerUIAnimation() {
  if (uiAnimating) return;
  uiAnimating = true;

  const anim = pick(UI_ANIMS);
  const digits = [
    document.getElementById('hourTen'),
    document.getElementById('hourOne'),
    document.getElementById('minTen'),
    document.getElementById('minOne'),
  ];
  const extras = [
    document.getElementById('date'),
    document.getElementById('weatherIcon'),
    document.getElementById('temp'),
    document.getElementById('rain'),
  ];
  const all = [...digits, ...extras];

  if (anim === 'scatter') animScatter(all);
  else if (anim === 'spin')    animSpin(digits, extras);
  else if (anim === 'rubber')  animRubber(all);
  else if (anim === 'gravity') animGravity(all);
  else if (anim === 'vortex')  animVortex(all);
  else if (anim === 'glitch')  animGlitch(all);
  else if (anim === 'flip3d')  animFlip3d(all);
  else                         animWave(all);

  setTimeout(() => { uiAnimating = false; }, 2000);
}

/* バラバラに飛び散って戻る */
function animScatter(els) {
  els.forEach((el, i) => {
    const tx = rand(-300, 300);
    const ty = rand(-300, 300);
    const rot = rand(-720, 720);
    const delay = i * 40;
    el.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${rand(0.1,0.5)})`, opacity: 0, offset: 0.45 },
      { transform: `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${rand(0.1,0.5)})`, opacity: 0, offset: 0.55 },
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
    ], { duration: 1200, delay, easing: 'cubic-bezier(0.68,-0.55,0.27,1.55)', fill: 'none' });
  });
}

/* バラバラに高速スピン */
function animSpin(digits, extras) {
  digits.forEach((el, i) => {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const spins = Math.floor(rand(2, 5));
    el.animate([
      { transform: 'rotate(0deg) scale(1)' },
      { transform: `rotate(${dir * spins * 360}deg) scale(${rand(0.6,1.4)})`, offset: 0.6 },
      { transform: 'rotate(0deg) scale(1)' },
    ], { duration: rand(800, 1400), delay: i * 80, easing: 'cubic-bezier(0.68,-0.55,0.27,1.55)', fill: 'none' });
  });
  extras.forEach((el, i) => {
    const dir = Math.random() < 0.5 ? 1 : -1;
    el.animate([
      { transform: 'rotate(0deg)' },
      { transform: `rotate(${dir * rand(180,540)}deg) scale(${rand(0.7,1.3)})`, offset: 0.5 },
      { transform: 'rotate(0deg)' },
    ], { duration: rand(700, 1200), delay: i * 60 + 200, easing: 'cubic-bezier(0.68,-0.55,0.27,1.55)', fill: 'none' });
  });
}

/* ぐにゃぐにゃ伸縮 */
function animRubber(els) {
  els.forEach((el, i) => {
    const sx = rand(0.3, 2.5);
    const sy = rand(0.3, 2.5);
    el.animate([
      { transform: 'scale(1,1)' },
      { transform: `scale(${sx},${1/sx})`, offset: 0.2 },
      { transform: `scale(${1/sy},${sy})`, offset: 0.4 },
      { transform: `scale(${rand(1.2,2)},${rand(0.3,0.7)})`, offset: 0.6 },
      { transform: `scale(${rand(0.5,0.8)},${rand(1.2,1.8)})`, offset: 0.8 },
      { transform: 'scale(1,1)' },
    ], { duration: rand(900, 1500), delay: i * 50, easing: 'ease-in-out', fill: 'none' });
  });
}

/* 重力落下 → 跳ね返り */
function animGravity(els) {
  els.forEach((el, i) => {
    const drop = rand(80, 200);
    el.animate([
      { transform: 'translateY(0) scaleY(1)', easing: 'ease-in' },
      { transform: `translateY(${drop}px) scaleY(0.7)`, offset: 0.4, easing: 'ease-out' },
      { transform: `translateY(-${drop*0.5}px) scaleY(1.2)`, offset: 0.6, easing: 'ease-in' },
      { transform: `translateY(${drop*0.2}px) scaleY(0.9)`, offset: 0.8, easing: 'ease-out' },
      { transform: 'translateY(0) scaleY(1)' },
    ], { duration: rand(900, 1300), delay: i * 60, fill: 'none' });
  });
}

/* 渦巻いて集まる */
function animVortex(els) {
  els.forEach((el, i) => {
    const angle = (Math.PI * 2 / els.length) * i;
    const r = rand(100, 250);
    const tx = Math.cos(angle) * r;
    const ty = Math.sin(angle) * r;
    el.animate([
      { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
      { transform: `translate(${tx}px,${ty}px) rotate(${rand(180,540)}deg) scale(0.2)`, opacity: 0.2, offset: 0.5 },
      { transform: 'translate(0,0) rotate(720deg) scale(1)', opacity: 1 },
    ], { duration: rand(1000, 1600), delay: i * 30, easing: 'cubic-bezier(0.4,0,0.2,1)', fill: 'none' });
  });
}

/* グリッチ */
function animGlitch(els) {
  els.forEach((el) => {
    let count = 0;
    const total = Math.floor(rand(6, 14));
    const iv = setInterval(() => {
      const tx = rand(-20, 20);
      const ty = rand(-10, 10);
      const skew = rand(-15, 15);
      const hue = Math.random() < 0.3 ? `hue-rotate(${rand(0,360)}deg)` : '';
      el.style.transform = `translate(${tx}px,${ty}px) skewX(${skew}deg)`;
      el.style.filter = hue;
      el.style.opacity = Math.random() < 0.2 ? '0' : '1';
      count++;
      if (count >= total) {
        clearInterval(iv);
        el.style.transform = '';
        el.style.filter = '';
        el.style.opacity = '1';
      }
    }, 60);
  });
}

/* 3D フリップ */
function animFlip3d(els) {
  els.forEach((el, i) => {
    const axis = Math.random() < 0.5 ? 'X' : 'Y';
    const deg  = pick([180, 360, 540, -360]);
    el.animate([
      { transform: `rotate${axis}(0deg) scale(1)` },
      { transform: `rotate${axis}(${deg/2}deg) scale(${rand(0.3,0.8)})`, offset: 0.5 },
      { transform: `rotate${axis}(${deg}deg) scale(1)` },
    ], { duration: rand(700, 1300), delay: i * 70, easing: 'cubic-bezier(0.68,-0.55,0.27,1.55)', fill: 'none' });
  });
}

/* 波のように順番にジャンプ */
function animWave(els) {
  els.forEach((el, i) => {
    const height = rand(40, 120);
    el.animate([
      { transform: 'translateY(0) scale(1)' },
      { transform: `translateY(-${height}px) scale(${rand(0.8,1.3)})`, offset: 0.3 },
      { transform: `translateY(${height*0.2}px) scale(${rand(0.9,1.1)})`, offset: 0.6 },
      { transform: 'translateY(0) scale(1)' },
    ], { duration: rand(600, 1000), delay: i * 100, easing: 'cubic-bezier(0.68,-0.55,0.27,1.55)', fill: 'none' });
  });
}

const EMOJIS = ['⭐','🌟','✨','💫','❤️','🧡','💛','💚','💙','💜','🫧','❄️','🌸','🎆','🎇','💥','🌈','🦋','🍀','🎉'];
const TYPES  = ['particle', 'ring', 'shockwave', 'beam', 'emoji'];

function rand(a, b) { return Math.random() * (b - a) + a; }
function pick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }

function spawnBurst(cx, cy) {
  const count = Math.floor(rand(4, 7));
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const type = pick(TYPES);
      if (type === 'particle') spawnParticles(cx, cy);
      else if (type === 'ring')      spawnRing(cx, cy);
      else if (type === 'shockwave') spawnShockwave(cx, cy);
      else if (type === 'beam')      spawnBeams(cx, cy);
      else                           spawnEmojis(cx, cy);
    }, i * 60);
  }
}

/* --- パーティクル噴出 --- */
function spawnParticles(cx, cy) {
  const colors = ['#fff','#ffe066','#ff6eb4','#66e0ff','#b8ff66','#ff9966','#cc88ff'];
  const n = Math.floor(rand(30, 50));
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    const size = rand(6, 18);
    const angle = rand(0, Math.PI * 2);
    const speed = rand(80, 280);
    const color = pick(colors);
    const shape = Math.random() < 0.5 ? '50%' : `${rand(2,6)}px`;
    el.style.cssText = `
      position:fixed; left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      background:${color}; border-radius:${shape};
      pointer-events:none; z-index:99999;
      box-shadow: 0 0 ${size*2}px ${color};
      transform:translate(-50%,-50%);
    `;
    document.body.appendChild(el);
    const tx = Math.cos(angle) * speed;
    const ty = Math.sin(angle) * speed;
    const dur = rand(600, 1200);
    el.animate([
      { transform: `translate(-50%,-50%) scale(1)`, opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(0,0,0.2,1)', fill: 'forwards' })
      .onfinish = () => el.remove();
  }
}

/* --- 光の輪 --- */
function spawnRing(cx, cy) {
  const colors = ['#fff','#ffe066','#ff6eb4','#66e0ff','#b8ff66'];
  const rings = Math.floor(rand(3, 6));
  for (let i = 0; i < rings; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      const color = pick(colors);
      const size = rand(20, 60);
      el.style.cssText = `
        position:fixed; left:${cx}px; top:${cy}px;
        width:${size}px; height:${size}px;
        border: ${rand(3,8)}px solid ${color};
        border-radius:50%; pointer-events:none; z-index:99999;
        transform:translate(-50%,-50%) scale(0);
        box-shadow: 0 0 20px ${color}, inset 0 0 20px ${color};
      `;
      document.body.appendChild(el);
      const maxScale = rand(4, 12);
      el.animate([
        { transform: `translate(-50%,-50%) scale(0)`, opacity: 1 },
        { transform: `translate(-50%,-50%) scale(${maxScale})`, opacity: 0 }
      ], { duration: rand(500, 900), easing: 'ease-out', fill: 'forwards' })
        .onfinish = () => el.remove();
    }, i * 80);
  }
}

/* --- 衝撃波 --- */
function spawnShockwave(cx, cy) {
  const el = document.createElement('div');
  const color = pick(['#fff','#ffe066','#ff6eb4','#66e0ff']);
  el.style.cssText = `
    position:fixed; left:${cx}px; top:${cy}px;
    width:10px; height:10px;
    background: radial-gradient(circle, ${color}aa 0%, transparent 70%);
    border-radius:50%; pointer-events:none; z-index:99999;
    transform:translate(-50%,-50%) scale(0);
  `;
  document.body.appendChild(el);
  el.animate([
    { transform: `translate(-50%,-50%) scale(0)`, opacity: 1 },
    { transform: `translate(-50%,-50%) scale(60)`, opacity: 0 }
  ], { duration: 700, easing: 'ease-out', fill: 'forwards' })
    .onfinish = () => el.remove();
}

/* --- 光線 --- */
function spawnBeams(cx, cy) {
  const n = Math.floor(rand(8, 16));
  const colors = ['#fff','#ffe066','#ff6eb4','#66e0ff','#b8ff66','#ff9966'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    const angle = (360 / n) * i + rand(-10, 10);
    const length = rand(80, 220);
    const width = rand(2, 8);
    const color = pick(colors);
    el.style.cssText = `
      position:fixed; left:${cx}px; top:${cy}px;
      width:${length}px; height:${width}px;
      background: linear-gradient(to right, ${color}, transparent);
      transform-origin: left center;
      transform: rotate(${angle}deg) scaleX(0);
      pointer-events:none; z-index:99999;
      border-radius:${width}px;
      box-shadow: 0 0 10px ${color};
    `;
    document.body.appendChild(el);
    el.animate([
      { transform: `rotate(${angle}deg) scaleX(0)`, opacity: 1 },
      { transform: `rotate(${angle}deg) scaleX(1)`, opacity: 0 }
    ], { duration: rand(400, 800), easing: 'ease-out', fill: 'forwards' })
      .onfinish = () => el.remove();
  }
}

/* --- 絵文字噴出 --- */
function spawnEmojis(cx, cy) {
  const n = Math.floor(rand(12, 20));
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    const emoji = pick(EMOJIS);
    const angle = rand(0, Math.PI * 2);
    const speed = rand(100, 300);
    const size  = rand(20, 48);
    const rot   = rand(-720, 720);
    el.style.cssText = `
      position:fixed; left:${cx}px; top:${cy}px;
      font-size:${size}px; line-height:1;
      pointer-events:none; z-index:99999;
      transform:translate(-50%,-50%);
      user-select:none;
    `;
    el.textContent = emoji;
    document.body.appendChild(el);
    const tx = Math.cos(angle) * speed;
    const ty = Math.sin(angle) * speed - rand(50, 150);
    const dur = rand(800, 1400);
    el.animate([
      { transform: `translate(-50%,-50%) rotate(0deg) scale(1)`, opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(0.3)`, opacity: 0 }
    ], { duration: dur, easing: 'cubic-bezier(0.2,0,0.8,1)', fill: 'forwards' })
      .onfinish = () => el.remove();
  }
}
</script>
